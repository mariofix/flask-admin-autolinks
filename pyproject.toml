[project]
name = "flask-admin-autolinks"
version = "0.1.1"
description = "Implements autolinks for related models in ModelView from Flask-Admin"
readme = "README.md"
authors = [{ name = "Mario Hernandez", email = "mariofix@proton.me" }]
requires-python = ">=3.11"
dependencies = ["flask-admin>=2.2.1"]

[project.urls]
repository = "https://github.com/mariofix/flask-admin-autolinks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/flask_admin_autolinks"]


[dependency-groups]
dev = ["pre-commit>=4.7.0"]


[tool.black]
line-length = 119
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 119
known_first_party = ["src/flask_admin_autolinks"]

[tool.flake8]
max-line-length = 119
extend-ignore = ["E203", "W503"]                   # black-compatible
exclude = [".git", "__pycache__", "build", "dist"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = ["B101"]
